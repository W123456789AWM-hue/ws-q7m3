name: ai_mind
description: 手机录音 → 电脑识别与 AI 发散复盘 → NAS；手机查看和设置
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 麦克风 PCM 流。固定 7.1.2：7.2.0 带的 record_android 2.3.0 编译不过（引用了不存在的类）
  record: 7.1.2
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0         # “仅 WiFi 上传”开关
  crypto: ^3.0.0                    # 在线更新：核对安装包的 sha256
  image_picker: ^1.1.2              # 反馈附图（从相册选截图）
  ed25519_edwards: ^0.3.1           # 手机直接在线更新：验更新清单的签名
  audioplayers: ^6.1.0              # 按钮音效、启动音效

# 录音插件的各平台实现固定在实测能编译的版本（record_android 2.3.0 编译不过）
dependency_overrides:
  record_android: 2.2.0
  record_platform_interface: 2.1.0
  record_ios: 2.1.1
  record_macos: 2.1.1
  record_linux: 2.1.3
  record_web: 2.1.3
  record_windows: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/splash.webp
    - assets/sounds/
