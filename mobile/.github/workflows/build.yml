# 云端自动打包：不用在自己电脑上装 Flutter。
# 把整个工程上传到 GitHub（私有仓库即可）后，在仓库的 Actions 页面等它跑完，
# 在运行结果页面底部的 Artifacts 里下载安装包。
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # 用固定的签名密钥：以后每次打的包都能直接覆盖安装，不丢数据
      - name: Use fixed signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - name: Generate platform projects
        run: flutter create --org com.example --project-name ai_mind --platforms=android,ios .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform projects
        run: flutter create --org com.example --project-name ai_mind --platforms=android,ios .
      - run: bash scripts/setup_ios.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ai_mind_unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ai_mind_unsigned.ipa
          if-no-files-found: error
