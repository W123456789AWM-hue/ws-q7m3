# 云端打包 + 发布在线更新。
#
# 平时：仓库的 Actions 页面 → Build all → Run workflow，只打包（在运行结果的 Artifacts 里下载）。
# 发布新版本：改 server/aimind/version.py 的 VERSION → 提交 → 打同名标签并推送：
#     git tag v0.9.2 && git push origin v0.9.2
#   会打包四个平台，然后自动发布到公开的发布仓库（只放安装包），所有装了程序的电脑 / 手机都会收到更新提示。
#   发布需要仓库 Settings → Secrets and variables → Actions 里有两个密钥：
#     UPDATE_SIGNING_KEY  更新清单的签名私钥（和程序里内置的公钥配对）
#     RELEASES_TOKEN      能往发布仓库上传的访问令牌（fine-grained，只给发布仓库 Contents: Read and write）
name: Build all

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  version:
    name: 版本号
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(python3 -c "exec(open('server/aimind/version.py').read()); print(VERSION)")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$V" ]]; then
            echo "::error::标签 ${GITHUB_REF#refs/tags/} 和 server/aimind/version.py 里的版本 $V 不一致"; exit 1
          fi

  windows:
    name: 电脑端 Windows
    needs: version
    runs-on: windows-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt pyinstaller pywebview pillow
      - run: python -m pytest -q
      - run: pyinstaller --noconfirm --distpath build/dist --workpath build/work packaging/aimind.spec
        env:   # 用户反馈发到哪个飞书群（仓库密钥，没设置也能打包）
          FEEDBACK_WEBHOOK: ${{ secrets.FEEDBACK_WEBHOOK }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
      - name: 绿色版 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/dist/AIMind -DestinationPath dist/AIMind-Windows.zip
      - name: 安装程序 AIMind-Setup-<版本>.exe
        shell: pwsh
        run: |
          $env:AIMIND_PAYLOAD = "$PWD\dist\AIMind-Windows.zip"
          pyinstaller --noconfirm --distpath dist --workpath build/setup_work packaging/setup.spec
      # 真的装一遍：安装程序坏了（比如里面没带主程序）就不发布
      - name: 试装安装程序
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist -Filter 'AIMind-Setup-*.exe' | Select-Object -First 1).FullName
          $p = Start-Process $setup -ArgumentList '--selfcheck' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "::error::installer selfcheck failed ($($p.ExitCode))"; exit 1 }
          $dir = Join-Path $env:RUNNER_TEMP 'aimind_install_test'
          $p = Start-Process $setup -ArgumentList '--silent', '--dir', $dir, '--no-shortcuts' -Wait -PassThru
          if (Test-Path "$env:TEMP\AIMind-Setup.log") { Get-Content "$env:TEMP\AIMind-Setup.log" -Encoding utf8 | Select-Object -Last 3 | ForEach-Object { [Console]::Out.WriteLine(($_ -replace '[^\x20-\x7e]', '?')) } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\AIMind.exe")) { Write-Host "::error::silent install failed ($($p.ExitCode))"; exit 1 }
          Write-Host "installer OK: $((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) MB installed"
          # 模拟在线更新：安装程序的工作目录在安装文件夹里（旧版程序启动它时就是这样），覆盖安装要成功
          $p = Start-Process $setup -ArgumentList '--silent', '--dir', $dir, '--no-shortcuts' -WorkingDirectory $dir -Wait -PassThru
          if (Test-Path "$env:TEMP\AIMind-Setup.log") { Get-Content "$env:TEMP\AIMind-Setup.log" -Encoding utf8 | Select-Object -Last 3 | ForEach-Object { [Console]::Out.WriteLine(($_ -replace '[^\x20-\x7e]', '?')) } }
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\AIMind.exe") -or (Test-Path "$dir.old")) { Write-Host "::error::upgrade install failed ($($p.ExitCode))"; exit 1 }
          Write-Host "upgrade install OK"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: server/dist/*
          if-no-files-found: error

  mac:
    name: 电脑端 Mac (${{ matrix.arch }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: intel }
    runs-on: ${{ matrix.runner }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: bash packaging/build_mac.sh
        env:
          FEEDBACK_WEBHOOK: ${{ secrets.FEEDBACK_WEBHOOK }}
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
          FEEDBACK_APP_ID: ${{ secrets.FEEDBACK_APP_ID }}
          FEEDBACK_APP_SECRET: ${{ secrets.FEEDBACK_APP_SECRET }}
      # 模拟在线更新：用程序里的更新脚本，拿刚打好的 dmg 替换一个“旧版”.app，要成功
      - name: 试一次在线更新
        run: |
          apps="$RUNNER_TEMP/Apps"; app="$apps/AI录音思考助手.app"; mkdir -p "$apps"
          mnt="$(mktemp -d)"; hdiutil attach -nobrowse -quiet -mountpoint "$mnt" dist/AIMind-Mac.dmg
          ditto "$(ls -d "$mnt"/*.app | head -1)" "$app"; hdiutil detach -quiet "$mnt"
          touch "$app/Contents/OLD_MARKER"
          "${TMPDIR:-/tmp}/aimind_build_venv/bin/python" -c "from aimind import updater; print(updater._MAC_SCRIPT)" > "$RUNNER_TEMP/up.sh"
          ok=0; AIMIND_UPDATE_NO_OPEN=1 bash "$RUNNER_TEMP/up.sh" 999999 "$PWD/dist/AIMind-Mac.dmg" "$app" || ok=$?
          tail -4 ~/Library/Logs/AIMind-update.log
          [ "$ok" = 0 ] && [ -x "$app/Contents/MacOS/AIMind" ] && [ ! -e "$app/Contents/OLD_MARKER" ] && [ ! -e "$app.old" ] \
            || { echo "::error::mac online update failed"; exit 1; }
          echo "mac update OK"
      - run: mv dist/AIMind-Mac.dmg "dist/AIMind-${{ needs.version.outputs.v }}-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: server/dist/*.dmg
          if-no-files-found: error

  android:
    name: 手机端 安卓
    needs: version
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # 固定的签名密钥：以后每次打的包都能直接覆盖安装（在线更新也靠它），不丢数据
      - run: mkdir -p ~/.android && cp ci/debug.keystore ~/.android/debug.keystore
      # 跳过 lintVital：image_picker_android 会让 lint 崩溃（lint 自身的 bug）
      - run: mkdir -p ~/.gradle/init.d && cp ci/no-lint-vital.gradle ~/.gradle/init.d/
      - run: flutter create --org com.example --project-name ai_mind --platforms=android,ios .
      - run: flutter pub get
      - run: flutter test
      - run: |
          V=${{ needs.version.outputs.v }}
          flutter build apk --release --split-per-abi --build-name=$V --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$V
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "AIMind-$V-android-arm64.apk"
          mv app-armeabi-v7a-release.apk "AIMind-$V-android-armv7.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-apk
          path: mobile/build/app/outputs/flutter-apk/AIMind-*.apk
          if-no-files-found: error

  ios:
    name: 手机端 iPhone
    needs: version
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --org com.example --project-name ai_mind --platforms=android,ios .
      - run: bash scripts/setup_ios.sh
      - run: flutter pub get
      - run: |
          V=${{ needs.version.outputs.v }}
          flutter build ios --release --no-codesign --build-name=$V --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$V
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "AIMind-$V-ios-unsigned.ipa" Payload
      # 配了付费开发者账号的证书和描述文件（仓库密钥 IOS_P12_BASE64 / IOS_P12_PASSWORD / IOS_PROFILE_BASE64）
      # 就再出一个签好名、能直接装的 AIMind-<版本>-ios.ipa；没配就只有未签名的（用免费 Apple ID 自签，见 docs/iphone-install.md）
      - name: 签名
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          V=${{ needs.version.outputs.v }}
          if [ -z "$IOS_P12_BASE64" ] || [ -z "$IOS_PROFILE_BASE64" ]; then
            echo "::notice::没配 iPhone 签名证书，只出未签名的 IPA"; exit 0
          fi
          bash scripts/sign_ios.sh build/ios/iphoneos/Runner.app "AIMind-$V-ios.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-ipa
          path: mobile/AIMind-*.ipa
          if-no-files-found: error

  release:
    name: 发布在线更新
    needs: [version, windows, mac, android, ios]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.v }}
      REPO: W123456789AWM-hue/aimind-releases
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: 整理安装包
        run: |
          mkdir -p release
          find artifacts -type f \( -name "AIMind-Setup-$V.exe" -o -name "AIMind-$V-*" \) -exec cp {} release/ \;
          ls -la release
          git log -1 --format=%B > notes.md       # 更新说明 = 这次提交的说明
      - name: 生成并签名 latest.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "::error::还没设置密钥 UPDATE_SIGNING_KEY，不能发布"; exit 1; fi
          python3 server/packaging/make_release.py --version "$V" --dir release --notes-file notes.md \
            --base-url "https://github.com/$REPO/releases/download/v$V"
      - name: 上传到发布仓库
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::还没设置密钥 RELEASES_TOKEN，不能发布"; exit 1; fi
          # 发布仓库是空的（刚建好、没有任何文件）时 GitHub 不让建发布：先放一个说明文件
          if ! gh api "repos/$REPO/commits?per_page=1" >/dev/null 2>&1; then
            printf '# AI 录音思考助手 · 发布\n\n这里只放安装包和在线更新清单，由云端打包自动发布。\n' > readme.md
            gh api -X PUT "repos/$REPO/contents/README.md" -f message="初始化发布仓库" -f content="$(base64 -w0 readme.md)"
          fi
          gh release delete "v$V" --repo "$REPO" --yes 2>/dev/null || true
          gh release create "v$V" --repo "$REPO" --title "AI 录音思考助手 v$V" --notes-file notes.md --latest release/*
